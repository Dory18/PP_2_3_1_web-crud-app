<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление пользователя</title>
    <style>
        body {
            background-color: #212529; /* Темно-серый фон */
            color: #FDFBF7; /* Молочный текст */
            font-family: Arial, Helvetica, sans-serif; /* Без засечек */
            margin: 0;
            padding: 0;
        }

        /* Главный контейнер центрирует всё содержимое */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 50px;
        }

        /* Общий блок контента */
        .content-block {
            max-width: 500px; /* Аккуратная ширина для формы */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h3 {
            margin-top: 80px;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #FDFBF7;
        }

        /* --- СТИЛИЗАЦИЯ ФОРМЫ --- */
        .form-card {
            width: 100%;
            background-color: #2c3034; /* Контрастный серый фон карточки */
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        /* Группа элементов: label + input + error */
        .form-group {
            display: flex;
            flex-direction: column; /* Элементы внутри группы идут сверху вниз */
            align-items: flex-start; /* Выравнивание по левому краю */
            margin-bottom: 20px; /* Заменяет устаревший <br/> */
        }

        .form-group:last-of-type {
            margin-bottom: 30px; /* Чуть больший отступ перед кнопкой отправки */
        }

        /* Текстовые метки полей */
        .form-label {
            color: #9ca3af; /* Приглушенный серый цвет */
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        /* Поля ввода (Inputs) */
        .form-input {
            width: 100%;
            background-color: #212529; /* Фон поля под цвет основного фона сайта */
            color: #FDFBF7; /* Молочный цвет вводимого текста */
            border: 2px solid #3d4246; /* Неброская темная рамка */
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Эффект при клике (фокусе) на поле ввода */
        .form-input:focus {
            border-color: #FFE4E1; /* Молочно-розовая рамка при фокусе */
            box-shadow: 0 0 8px rgba(255, 228, 225, 0.2);
        }

        /* Ошибки валидации Spring */
        .error-message {
            color: #FF69B4; /* Наш фирменный розовый цвет для ошибок */
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 6px;
        }

        /* --- СТИЛИЗАЦИЯ КНОПОК --- */
        .btn-center-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .my-custom-btn {
            background-color: #FDFBF7;
            color: #212529;
            border-radius: 12px;
            padding: 12px 28px;
            font-size: 1.15rem;
            font-weight: 600;
            border: 2px solid #FFE4E1;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.2s, transform 0.2s;
            box-sizing: border-box;
        }

        .my-custom-btn:hover {
            background-color: #FFFEEA;
            transform: translateY(-1px);
        }

        .my-custom-btn a {
            color: inherit;
            text-decoration: none;
            display: block;
        }

        /* Специфичные настройки для кнопки-инпута submit */
        .btn-submit {
            width: 100%; /* Кнопка отправки растягивается на всю ширину карточки */
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="content-block">

        <h3>Новый пользователь</h3>

        <div class="form-card">
            <form th:method="POST" th:action="@{/users}" th:object="${user}">

                <div class="form-group">
                    <label for="lastName" class="form-label">Фамилия</label>
                    <input th:field="*{lastName}" type="text" id="lastName" class="form-input"
                           placeholder="Введите фамилию"/>
                    <div class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="form-group">
                    <label for="firstName" class="form-label">Имя</label>
                    <input th:field="*{firstName}" type="text" id="firstName" class="form-input"
                           placeholder="Введите имя"/>
                    <div class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="form-group">
                    <label for="middleName" class="form-label">Отчество</label>
                    <input th:field="*{middleName}" type="text" id="middleName" class="form-input"
                           placeholder="Введите отчество"/>
                    <div class="error-message" th:if="${#fields.hasErrors('middleName')}"
                         th:errors="*{middleName}"></div>
                </div>

                <div class="form-group">
                    <label for="age" class="form-label">Возраст</label>
                    <input th:field="*{age}" type="text" id="age" class="form-input" placeholder="Укажите возраст"/>
                    <div class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                </div>

                <input type="submit" value="Добавить" class="my-custom-btn btn-submit">
            </form>
        </div>

        <div class="btn-center-container">
            <button class="my-custom-btn">
                <a href="/users/">Назад к списку</a>
            </button>
        </div>

    </div>
</div>

</body>
</html>
