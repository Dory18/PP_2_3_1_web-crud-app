<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователь</title>
    <style>
        body {
            background-color: #212529; /* Темно-серый фон */
            color: #FDFBF7; /* Молочный текст */
            font-family: Arial, Helvetica, sans-serif; /* Без засечек */
            margin: 0;
            padding: 0;
        }

        /* Главный контейнер центрирует всё содержимое */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding-bottom: 50px;
        }

        /* Общий блок контента */
        .content-block {
            max-width: 500px; /* Сузили блок для аккуратного вида карточки */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h3 {
            margin-top: 80px;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #FDFBF7;
        }

        /* --- КАРТОЧКА ПОЛЬЗОВАТЕЛЯ --- */
        .user-card {
            width: 100%;
            background-color: #2c3034; /* Контрастный серый цвет для блока данных */
            border-radius: 12px;
            padding: 10px 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            box-sizing: border-box;
        }

        /* Строка данных: название слева, значение справа */
        .info-row {
            display: flex;
            justify-content: space-between; /* Расталкивает элементы по краям */
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #3d4246;
        }

        /* Убираем нижнюю рамку у последней строки */
        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #9ca3af; /* Приглушенный серый для названий полей */
            font-weight: bold;
            font-size: 0.95rem;
        }

        .info-value {
            color: #FDFBF7; /* Молочный цвет для самих значений */
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Сообщение об ошибке */
        .error-message {
            color: #FF69B4;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* --- БЛОК КНОПОК ДЕЙСТВИЙ --- */
        .actions-block {
            display: flex;
            gap: 15px; /* Зазор между кнопками Редактировать и Удалить */
            width: 100%;
            justify-content: center;
            margin-bottom: 25px;
        }

        /* Общие базовые стили для всех кнопок */
        .my-custom-btn {
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
            transition: background-color 0.2s, transform 0.2s, border-color 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        /* Светлая (молочная) кнопка: Редактировать и Назад */
        .btn-milky {
            background-color: #FDFBF7;
            color: #212529;
            border: 2px solid #FFE4E1;
        }

        .btn-milky:hover {
            background-color: #FFFEEA;
            transform: translateY(-1px);
        }

        .btn-milky a {
            color: inherit;
            text-decoration: none;
            display: block;
        }

        /* Опасная (розовая) кнопка: Удалить */
        .btn-danger {
            background-color: transparent;
            color: #FF69B4;
            border: 2px solid #FF69B4;
        }

        .btn-danger:hover {
            background-color: #FF69B4;
            color: #212529;
            transform: translateY(-1px);
        }

        /* Сброс дефолтных стилей формы, чтобы она не ломала флекс-ряд */
        .inline-form {
            margin: 0;
            display: inline;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="content-block">

        <h3>Пользователь</h3>

        <div th:if="${user != null}" style="width: 100%;">

            <div class="user-card">
                <div class="info-row">
                    <span class="info-label">ИД</span>
                    <span class="info-value" th:text="${user.id}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Фамилия</span>
                    <span class="info-value" th:text="${user.lastName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Имя</span>
                    <span class="info-value" th:text="${user.firstName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Отчество</span>
                    <span class="info-value" th:text="${user.middleName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Возраст</span>
                    <span class="info-value" th:text="${user.age}"></span>
                </div>
            </div>

            <div class="actions-block">
                <button class="my-custom-btn btn-milky">
                    <a th:href="@{/users/edit(id=${user.id})}">Редактировать</a>
                </button>

                <form th:method="DELETE" th:action="@{/users/delete(id=${user.id})}" class="inline-form">
                    <input type="submit" value="Удалить" class="my-custom-btn btn-danger"/>
                </form>
            </div>

        </div>

        <div th:if="${user == null}">
            <p class="error-message">Пользователь не найден.</p>
        </div>

        <button class="my-custom-btn btn-milky" style="margin-top: 10px;">
            <a href="/users/">Пользователи</a>
        </button>

    </div>
</div>

</body>
</html>
